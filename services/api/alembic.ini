# Used only for developer commands, e.g.:
#   .venv/bin/alembic revision --autogenerate -m "describe change"
# The app runs migrations itself on startup (app/database/migrate.py).
[alembic]
script_location = app/database/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
